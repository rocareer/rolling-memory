name: Bug report
description: Report a reproducible defect in Rolling Memory
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove secrets, API keys, personal data, and private transcripts before submitting.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `rmem --version` (or the release tag)
      placeholder: "0.0.x / v0.0.x"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - local (offline)
        - cloud
        - not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and harness
      description: OS version and the agent/harness you use (if any)
      placeholder: "macOS 15 / ZCode; Ubuntu 24.04 / CLI"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Minimal commands or actions that reproduce the issue
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant logs with secrets removed
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, API keys, personal data, and private transcripts from this report.
          required: true
