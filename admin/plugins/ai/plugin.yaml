    name: plugin/ai/model/read
    pid: plugin/ai/model
  - title: 新增模型
    type: node
    name: plugin/ai/model/create
    pid: plugin/ai/model
  - title: 编辑模型
    type: node
    name: plugin/ai/model/update
    pid: plugin/ai/model
  - title: 删除模型
    type: node
    name: plugin/ai/model/delete
    pid: plugin/ai/model
  - title: 绑定渠道
    type: node
    name: plugin/ai/model/bind
    pid: plugin/ai/model
  # ---- 用量与日志（plugin/ai/usage|usage-log/*）----
  - title: 查看用量
    type: node
    name: plugin/ai/usage/read
    pid: plugin/ai/usage
  - title: 查看调用日志
    type: node
    name: plugin/ai/usage-log/read
    pid: plugin/ai/usage-log
  - title: 尝试链详情
    type: node
    name: plugin/ai/usage-log/detail
    pid: plugin/ai/usage-log
  # ---- 总览与设置（页面自取数；设置面因宿主配置页不为 plugin.* 分组生成 tab 而由插件自管）----
  - title: 查看总览
    type: node
    name: plugin/ai/overview/index
    pid: plugin/ai/overview
  - title: 保存接入设置
    type: node
    name: plugin/ai/settings/save
