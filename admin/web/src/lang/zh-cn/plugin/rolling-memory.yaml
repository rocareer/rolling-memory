    bannerTitle: 对照基准说明：内置 locomo-backboard 冻结协议，作为长程多会话对话参照（主基准见剑桥 ATM-Bench）
    bannerDesc: 除第一主基准剑桥大学 ATM-Bench 外，系统同时保留 LoCoMo（ACL 2024）与开源评测框架 locomo-backboard（https://github.com/Backboard-io/Backboard-Locomo-Benchmark）作为多会话对话记忆的横向参照。内置评测模块复刻官方答题智能体（locomo-answer）与判官智能体（locomo-judge）提示词，并通过三枚 SHA-1 摘要只读校验。
    card1Title: 1. 协议一致性（locomo-backboard）
    card1Tag: 协议同构
    card1Body: 答题侧采用「编号记忆行 + 空行 + 原题直问」，评分侧采用 Backboard 官方 1,694 字节语义判词（JSON 输出 CORRECT / WRONG），与公开榜单中的 Backboard、Zep、Mem0、Memobase、LangMem、OpenAI Memory 保持同一评判协议。
    card2Title: 2. 提示词 SHA-1 只读校验
    card2Tag: 完整性校验
    card2Body: ① 答题 System 摘要 0d591628…；② 判官 System 摘要 497f7892…；③ 判官 User 模板摘要 38f9b6a1…（1,694 字节）。每次运行前自动执行协议摘要核验，防止提示词漂移。
    card3Title: 3. 历史架构对照：LLM + 向量重型路线（92.79%）
    card3Tag: 历史成绩 · 早期重型架构
    card3Body: 历史成绩：我方早期重型架构（LLM 抽取 + 向量检索 + 图/关系增强）在 LoCoMo 1,540 题全量上的存档读数：总分 92.79%（GPT-4.1 temp 0.1 判官；单跳 89.10%、多跳 88.40%、开放域 81.30%、时序 94.40%、证据命中 98.90%）。该路线不再提供；现行检索核为 0-Vector / 0-LLM 本机确定性检索；端到端 1,540 全量 85.26% 由 LLM 答器+判官在 Top-96 交付上评出（见榜单我方行）。
