leaderboard:
    title: LoCoMo-Backboard Leaderboard (Comparative Reference)
    backEvalLabBtn: Back to Evaluation Lab
    protocolBadge: 'Built-in Protocol: locomo-backboard (locomo-frozen-2026-10-11)'
    boardBadge: 'Comparative Benchmark: locomo-backboard Leaderboard'
    pinsVerifiedBadge: '✓ 3 SHA1 Protocol Pins Verified'
    pillText: 'COMPARATIVE REFERENCE · 1:1 PROTOCOL'
    bannerTitle: 'Comparative Reference: Built-in locomo-backboard frozen protocol for multi-session dialogue comparison (Primary benchmark: Cambridge ATM-Bench)'
    bannerDesc: 'Alongside our primary benchmark (University of Cambridge ATM-Bench), Rolling Memory includes LoCoMo (ACL 2024) under the open-source locomo-backboard harness (https://github.com/Backboard-io/Backboard-Locomo-Benchmark) as a comparative conversational reference. The evaluation module replicates the official Answer Agent (locomo-answer) and Judge Agent (locomo-judge) prompts with three read-only SHA-1 digests.'
    card1Title: '1. Protocol Alignment (locomo-backboard)'
    card1Tag: '1:1 Protocol Parity'
    card1Body: 'Uses numbered memory lines + blank line + direct question for answering, and the 1,694-byte semantic judge prompt emitting JSON CORRECT / WRONG, matching the evaluation protocol used for Backboard, Zep, Mem0, Memobase, LangMem, and OpenAI Memory.'
    card2Title: '2. Read-Only SHA-1 Prompt Digests'
    card2Tag: 'Integrity Verification'
    card2Body: '1) Answer System SHA-1 0d591628…; 2) Judge System SHA-1 497f7892…; 3) Judge User Template SHA-1 38f9b6a1… (1,694 bytes). Protocol digests are verified before each evaluation run.'
    card3Title: '3. Historical Architecture: LLM + Vector Heavyweight Route (92.79%)'
    card3Tag: 'Historical · Early Heavyweight Architecture'
    card3Body: 'Historical result: our early heavyweight architecture (LLM extraction + vector retrieval + graph/relational augmentation) on the full LoCoMo 1,540-question set: 92.79% overall (GPT-4.1 temp 0.1 judge; Single-hop 89.10%, Multi-hop 88.40%, Open-domain 81.30%, Temporal 94.40%, Evidence Hit 98.90%). This route is no longer provided; the current engine is the 0-Vector / 0-LLM on-device deterministic retriever (latest full 1,540 run: 85.26%, see our board row).'
