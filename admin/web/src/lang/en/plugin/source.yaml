    title: Title
    titlePlaceholder: e.g. Internal mirror
    type: Type
    location: Catalog location
    locationLocalPlaceholder: Path relative to the repository root, e.g. catalog/catalog.yaml
    locationHttpPlaceholder: https://example.com/plugins/catalog.yaml
    locationLocalTip: Relative paths must stay inside the repository root; absolute paths require "Allow absolute paths".
    locationHttpTip: 'HTTPS only; plain HTTP requires the explicit switch. URLs must not carry userinfo, query or fragment.'
    locationGitPlaceholder: https://github.com/org/repo.git#main!catalog/catalog.yaml
    locationGitTip: 'Syntax: <repo URL>[#<ref>][!<in-repo catalog path>]. Public repositories over http(s) only (no ssh or credential-bearing URLs); defaults to catalog.yaml at the repository root; shallow single-branch clone, re-cloned on every sync and package fetch.'
