# plugin: ai v0.2.0
# AI 路由插件：渠道管理、模型管理（含绑定）、调度与熔断、计费与用量、日志、监控六项，
# 本批（0.2.0）另加：厂商继承、应用接入（API Key）、异步任务、语音（TTS）、多驱动注册表、
# 渠道准入（RPM/TPM）、公开面按 Key 限流、SSE 三级上限。
# 形态 mixed：9 张表全部由本插件迁移自管（migrations/1_init.*.sql + 2..6 增量），entities 留空——
#   L2 实体段只属声明式由引擎建表的实体；本插件的表需要复合唯一键
#   （(model_id,channel_id)、(request_id,attempt)）与具名 CHECK，L2 spec 表达不了（L2 的 unique 是字段级布尔）。
# 后台 42 条路由挂在宿主建好的 plugin/ai 子组上（只写相对段）；4 条公开路由由插件包 MountPublic 逐字对外。
# 键集闭集：未知键拒装（internal/plugin/manifest）；机制与纪律见 plugins/README.md。
#
# 迁移编号（1..N 连续前缀是硬要求，check-plugin-manifest.sh 只校验唯一 + up/down 成对）：
#   1_init → 2_usage_partial_billing → 3_channel_driver_supplier_gate
#   → 4_api_key → 5_task → 6_voice。
#   已装插件要应用 2..6 只能走「disable → uninstall --keep-files → install --enable」：
#   宿主没有「对已装插件单独应用新迁移」的命令（迁移只在安装编排第 ⑥ 步执行），
#   且 install 对台账已有行的插件硬拒（internal/plugin/cli/dbwrite.go:45-51）。
#   代价与回滚凭据见同目录 README「升级流程」节。
name: ai
title: AI 路由
version: 0.2.0
kind: mixed
# 公开路由（MountPublic）需要机制接口 >=1.1；上界 <2 锁定 1.x 语义。
host_api: ">=1.1 <2"
menus:
  # ① 分组目录（pid 空 = 根；只作侧栏分组，不产生前端路由）
  - title: AI 路由
    type: dir
    name: plugin/ai
    path: plugin/ai
    icon: lucide-bot
    weigh: 100
  # ② 9 个功能页（component 必须精确写落位副本路径：前端按 import.meta.glob('/src/views/admin/**/*.vue') 精确查表。
  #    「调用日志」是菜单与权限节点的锚点，功能页复用「用量统计」的 logs tab，见该菜单下的注）
  - title: 总览
    type: menu
    name: plugin/ai/overview
    path: plugin/ai/overview
    component: /src/views/admin/plugin/ai/overview/index.vue
    pid: plugin/ai
    icon: lucide-gauge
    weigh: 100
  - title: AI 资产体检
    type: menu
    name: plugin/ai/index
    path: plugin/ai/index
    component: /src/views/admin/plugin/ai/index.vue
    pid: plugin/ai
    icon: lucide-stethoscope
    weigh: 98
  - title: AI 成本账单
    type: menu
    name: plugin/ai/cost
    path: plugin/ai/cost
    component: /src/views/admin/plugin/ai/cost.vue
    pid: plugin/ai
    icon: lucide-coins
    weigh: 95
  - title: 渠道管理
    type: menu
    name: plugin/ai/channel
    path: plugin/ai/channel
    component: /src/views/admin/plugin/ai/channel/index.vue
    pid: plugin/ai
    icon: lucide-server
    weigh: 90
  - title: 厂商管理
    type: menu
    name: plugin/ai/supplier
    path: plugin/ai/supplier
    component: /src/views/admin/plugin/ai/supplier/index.vue
    pid: plugin/ai
    icon: lucide-building-2
    weigh: 85
  - title: 模型管理
    type: menu
    name: plugin/ai/model
    path: plugin/ai/model
    component: /src/views/admin/plugin/ai/model/index.vue
    pid: plugin/ai
    icon: lucide-boxes
    weigh: 80
  - title: 应用接入
    type: menu
    name: plugin/ai/apikey
    path: plugin/ai/apikey
    component: /src/views/admin/plugin/ai/apikey/index.vue
    pid: plugin/ai
    icon: lucide-key-round
    weigh: 75
  - title: 用量统计
    type: menu
    name: plugin/ai/usage
    path: plugin/ai/usage
    component: /src/views/admin/plugin/ai/usage/index.vue
    pid: plugin/ai
    icon: lucide-chart-column
    weigh: 70
  - title: 调用日志
    type: menu
    name: plugin/ai/usage-log
    path: plugin/ai/usage-log
    # 日志（含尝试链详情）是「用量统计」页里的 logs tab（权限节点 plugin/ai/usage-log/read|detail
    # 也挂在那个 tab 上），插件源与落位副本里没有独立的 usage-log 页面：
    # 指向不存在的 component 会让侧栏菜单点击后不注册任何路由（空落点）。
    component: /src/views/admin/plugin/ai/usage/index.vue
    pid: plugin/ai
    icon: lucide-scroll-text
    weigh: 60
  - title: 异步任务
    type: menu
    name: plugin/ai/task
    path: plugin/ai/task
    component: /src/views/admin/plugin/ai/task/index.vue
    pid: plugin/ai
    icon: lucide-list-todo
    weigh: 55
  - title: 语音合成
    type: menu
    name: plugin/ai/voice
    path: plugin/ai/voice
    component: /src/views/admin/plugin/ai/voice/index.vue
    pid: plugin/ai
    icon: lucide-audio-lines
    weigh: 50
  # ③ 权限节点（36 个）：名字必须与 BuildCheckPath(FullPath) 逐字相等。
  #    列表/详情（末段 list|get）由中间件按 [同名, 同前缀/read] OR 判定，故只声明 read 一个节点即可覆盖两者。
  #    v1 的 18 个 + 本批 18 个（厂商 4 / 应用接入 6 / 任务 3 / 语音 5）。
  # ---- 渠道（plugin/ai/channel/*）----
  - title: 查看渠道
    type: node
    name: plugin/ai/channel/read
    pid: plugin/ai/channel
  - title: 新增渠道
    type: node
    name: plugin/ai/channel/create
    pid: plugin/ai/channel
  - title: 编辑渠道
    type: node
    name: plugin/ai/channel/update
    pid: plugin/ai/channel
  - title: 删除渠道
    type: node
    name: plugin/ai/channel/delete
    pid: plugin/ai/channel
  - title: 渠道启停
    type: node
    name: plugin/ai/channel/switch
    pid: plugin/ai/channel
  - title: 渠道探活
    type: node
    name: plugin/ai/channel/probe
