# 一、它能做什么
whatQ: 它能做什么？
whatLead: 让你的编程 Agent 记得以前的对话。
whatBody: 你和 Agent 的对话，以及你挂载的项目文件夹，都会原样存进你电脑上的一个数据库文件。Agent 需要查以前的事时，调用一个叫 recall 的工具，拿回原文和出处。
whatWithoutLabel: 没有记忆时
whatWithoutText: 你问「上次那个状态栏闪烁是在哪修的？」，Agent 只能猜关键词，来回搜三五轮文件才找到。
whatWithLabel: recall 命中时
whatWithText: recall 找出当时提到那个文件的对话，Agent 直接打开它。
whatCost: 长任务里 Agent 的上下文常在 10 万到 40 万 token，每多搜一轮，这些内容都要重新发给大模型一次。少走一轮，就省下这么多。
whatAuto: 保存是自动的：做完的对话会在后台记下来，Agent 不用停下来记笔记。

# 二、费用与隐私
costQ: 要花钱吗？谁能看到我的数据？
costLead: 不花钱，中间也没有别人。
promiseFreeTitle: 免费
promiseFreeText: 没有大模型或向量化费用，不用托管，不用注册账号，不用绑卡。源码公开，一切非商业用途免费。
promiseLiveTitle: 不用等
promiseLiveText: 后台不做摘要，也不建向量索引。对话存下几毫秒后就能搜到。
promiseLocalTitle: 留在本机
promiseLocalText: 一个程序文件加一个数据库文件，都在你自己电脑上。存和搜都不联网——除了你和正在干活的 Agent，没有别人能看到你的代码和对话。
promiseOwnTitle: 随时带走
promiseOwnText: 数据就是一个标准 SQLite 文件，可以随时备份、导出成 JSON，或者直接删掉。
costNote: 需要说明一点：如果你的 Agent 用的是 Claude、GPT 这类在线模型，recall 找回的内容会和 Agent 读到的其他文件一样，一起发给那个模型。

# 三、真的有用吗
savingsQ: 真的有用吗？
savingsLead: 按我们自己的统计，大约一半时候有用。
ledgerCaption: '我们在一台开发机上统计了 24 小时：{total} 轮 Agent 对话，每轮事后逐一复核'
ledgerHelpedLabel: 帮上了
ledgerIdleLabel: 没帮上
ledgerSaved: 帮上的那些轮，估计少搜了 {low}–{high} 轮。
ledgerMiss: 没命中时，这次调用反而多花一轮。它是基于关键词和统计的检索，问题和记录里一个词都对不上时就会漏。
