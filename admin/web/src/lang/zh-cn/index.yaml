# 四、开始使用
startQ: 怎么开始用？
startLead: 装好，接上你的 Agent，就可以继续干活了。
stepInstallTitle: 安装
stepInstallText: 需要 Go 1.26 或更高版本。macOS 和 Linux 上，这一步会编译程序，并接入它找到的 Agent。Windows 上改为在 PowerShell 里运行 install.ps1。
stepCheckTitle: 检查是否接好
stepCheckText: 确认每个 Agent 都能看到记忆工具。
stepAdjustTitle: 不想要的都可以关
stepAdjustText: 在 ZCode 和 Claude Code 里，安装时还会给每条提问加一个简短提醒，可能带上相关的过往记忆；同时在本地记一笔 recall 有没有帮上忙，供控制台统计。你可以只留 recall 工具、关掉这份记录，或者全部移除。
adjustMcpOnly: 只保留 recall 工具：先移除提醒和技能文件，再重新接入
adjustHooksOff: 关掉「recall 是否帮上忙」的本地记录（同时也会关掉重复过滤）
adjustUninstall: 删掉安装时加的所有内容
agentsTitle: 支持的 Agent
agentsAutoText: install 不带名字时，会接入你电脑上找到的这几个。
agentsNamedText: 下面三个需要点名接入。
agentsOther: 其他支持 MCP 的工具，运行 rolling-memory mcp 即可。
consoleText: 本地控制台可以浏览存下的内容，也能看到 recall 帮上忙的比例。

# 五、预览
previewQ: 接下来做什么？
previewTag: 预览
previewLead: 脉冲模式：一个看不到你原文的云端引擎。
previewBody: 依然不用大模型，也不用向量库。你的电脑只上传打乱过、无法还原的编码，引擎不看原文就能找到匹配，原文再从你本机的副本里补回来。这是对 Agent 记忆新做法的一次早期探索，不包含在这次发布里。
previewApply: 申请试用
previewSupport: 问题与支持

