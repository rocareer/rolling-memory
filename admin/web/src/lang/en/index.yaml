# 1. What it does
whatQ: What does it do?
whatLead: It gives your coding agent a memory of past sessions.
whatBody: Your conversations with the agent, plus any project folders you add, are saved word for word in one database file on your computer. When the agent needs something from the past, it calls a tool named recall and gets back the original passage and where it came from.
whatWithoutLabel: Without memory
whatWithoutText: You ask "where did we fix that status-bar flicker?" The agent guesses keywords and spends three to five rounds of searching files to find out.
whatWithLabel: With a recall hit
whatWithText: recall returns the earlier conversation that names the file, so the agent opens it directly.
whatCost: In a long session the agent's context is often 100k–400k tokens, and every extra round of searching sends all of it to the model again. Skipping even one round saves that much.
whatAuto: Saving is automatic. Finished conversations are recorded in the background; the agent never has to stop and write notes.

# 2. Cost and privacy
costQ: What does it cost, and who sees my data?
costLead: Nothing to pay, and no one in the middle.
promiseFreeTitle: Free
promiseFreeText: No model or embedding fees, no hosting, no account, no credit card. Source-available, free for any noncommercial use.
promiseLiveTitle: No waiting
promiseLiveText: Nothing is summarized or indexed in the background. A conversation is searchable within milliseconds of being saved.
promiseLocalTitle: Stays local
promiseLocalText: One program file and one database file on your machine. Saving and searching make no network requests — only you and the agent you're working with see your code and conversations.
promiseOwnTitle: Yours to keep
promiseOwnText: It's a standard SQLite file. Back it up, export it to JSON, or delete it whenever you like.
costNote: One thing to know — if your agent runs on a hosted model such as Claude or GPT, the passages recall returns become part of what the agent sends to that model, just like the files it reads.

# 3. Does it actually help
savingsQ: Does it actually help?
savingsLead: About half the time, by our own count.
ledgerCaption: 'Our own check over 24 hours on one development machine: {total} agent turns, each reviewed after the fact'
ledgerHelpedLabel: Helped
ledgerIdleLabel: No help
ledgerSaved: The turns that helped saved an estimated {low}–{high} rounds of searching.
ledgerMiss: When recall misses, that call costs a round instead of saving one. It's a simple keyword-and-statistics search, so it misses when your question shares no words with the record.
ledgerBench: "On the public ATM-Bench test it finds the right record within the top 10 results {score} of the time (official Recall{'@'}10)."
