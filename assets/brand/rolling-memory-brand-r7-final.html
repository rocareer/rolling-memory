<script>
  (function () {
    var root = document.getElementById("rm-brand");
    var structTabs = document.querySelectorAll("#rm-struct-tabs .nav-link");
    var gridBox = document.getElementById("rm-grid-toggle");
    var stackEl = document.getElementById("rm-archive-stack");
    if (!root || !stackEl) return;

    var FAMILIES = [
      {
        key: "f3",
        code: "方案一 · F03 ARCHIVO BLACK（Open WebUI 品牌曲膝刻槽百叶）",
        spec: "23u 左柱 + 5.2u 垂直刻槽 + 曲膝垂直落腿 + 后两层疏密百叶光栅",
        filePrefix: "f03-archivo",
        font: "'Archivo', system-ui, sans-serif"
      },
      {
        key: "p3",
        code: "方案二 · P03 PRISM 45°（八角光学棱镜刻槽百叶）",
        spec: "24u 左柱 + 5.2u 垂直刻槽 + 45° 光学倒角字碗 + 28° 直斜腿 + 后两层疏密百叶光栅",
        filePrefix: "p03-prism",
        font: "'Space Grotesk', system-ui, sans-serif"
      },
      {
        key: "f1",
        code: "方案三 · R07 GROTESK STENCIL（01 工业几何圆碗刻槽百叶）",
        spec: "24u 左柱 + 5.2u 垂直刻槽 + R30/R13 偏心圆碗 + 28° 直斜腿 + 后两层疏密百叶光栅",
        filePrefix: "r07-grotesk",
        font: "'Plus Jakarta Sans', system-ui, sans-serif"
      }
    ];

    var state = { struct: "sl", guides: false };

    function buildMark(family, mode, structMode) {
      // mode: 'yang' | 'yin' | 'rain-yang' | 'rain-yin'
      var useStencil = structMode !== "solid";
      var useLouver = structMode === "sl";
      var glyphId = "#" + family + (useStencil ? "s" : "") + "-glyph";
      var m1 = "m-" + family + "-1";
      var m2 = "m-" + family + "-2";
      var dx = 16;

      var guidesMarkup =
        '<g class="rm-guides" fill="none" stroke="currentColor">' +
        '<line x1="0" y1="16" x2="128" y2="16"/><line x1="0" y1="74" x2="128" y2="74"/><line x1="0" y1="112" x2="128" y2="112"/>' +
        '<line x1="12" y1="0" x2="12" y2="128"/><line x1="83" y1="0" x2="83" y2="128"/>' +
        '</g>';

      function wrapLouver(level, inner) {
        if (!useLouver) return inner;
        return '<g mask="url(#m-louver-' + level + ')">' + inner + '</g>';
      }

      if (mode === "yang") {
        var c1 = useLouver ? "#2c2e38" : "#4a4d5c";
        var c2 = useLouver ? "#686c7e" : "#8c90a4";
        return guidesMarkup +
          '<g filter="url(#rm-elev)">' +
          '<g mask="url(#' + m2 + ')">' + wrapLouver(2, '<use href="' + glyphId + '" transform="translate(' + (dx * 2) + ' 0)" fill="' + c2 + '"/>') + '</g>' +
          '<g mask="url(#' + m1 + ')">' + wrapLouver(1, '<use href="' + glyphId + '" transform="translate(' + dx + ' 0)" fill="' + c1 + '"/>') + '</g>' +
          '<use href="' + glyphId + '" fill="#0f1014"/>' +
          '</g>';
      }

      if (mode === "yin") {
        var y1 = useLouver ? "#bfc2d0" : "#a0a4b8";
        var y2 = useLouver ? "#6e7285" : "#585c6e";
        return guidesMarkup +
          '<g filter="url(#rm-glow)">' +
          '<g mask="url(#' + m2 + ')">' + wrapLouver(2, '<use href="' + glyphId + '" transform="translate(' + (dx * 2) + ' 0)" fill="' + y2 + '"/>') + '</g>' +
          '<g mask="url(#' + m1 + ')">' + wrapLouver(1, '<use href="' + glyphId + '" transform="translate(' + dx + ' 0)" fill="' + y1 + '"/>') + '</g>' +
          '<use href="' + glyphId + '" fill="#f5f5f7"/>' +
          '</g>';
      }

      if (mode === "rain-yang") {
        return guidesMarkup +
          '<g filter="url(#rm-elev)">' +
          '<g mask="url(#' + m2 + ')">' + wrapLouver(2, '<use href="' + glyphId + '" transform="translate(' + (dx * 2) + ' 0)" fill="url(#g-r7-light-l2)"/>') + '</g>' +
          '<g mask="url(#' + m1 + ')">' + wrapLouver(1, '<use href="' + glyphId + '" transform="translate(' + dx + ' 0)" fill="url(#g-r7-light-l1)"/>') + '</g>' +
          '<use href="' + glyphId + '" fill="url(#g-r7-light-l0)"/>' +
          '</g>';
      }

      // rain-yin: 黑底 R7 热区记忆冷却轨迹
      return guidesMarkup +
        '<g filter="url(#rm-glow)">' +
        '<g mask="url(#' + m2 + ')">' + wrapLouver(2, '<use href="' + glyphId + '" transform="translate(' + (dx * 2) + ' 0)" fill="url(#g-r7-dark-l2)"/>') + '</g>' +
        '<g mask="url(#' + m1 + ')">' + wrapLouver(1, '<use href="' + glyphId + '" transform="translate(' + dx + ' 0)" fill="url(#g-r7-dark-l1)"/>') + '</g>' +
        '<use href="' + glyphId + '" fill="url(#g-r7-dark-l0)"/>' +
        '</g>';
    }

    function renderAll() {
      root.classList.toggle("show-guides", !!state.guides);
      if (gridBox) gridBox.checked = !!state.guides;
      structTabs.forEach(function (t) {
        var on = t.getAttribute("data-struct") === state.struct;
        t.classList.toggle("active", on);
        t.setAttribute("aria-selected", on ? "true" : "false");
      });

      var editions = [
        { mode: "yang", cls: "ed-yang", label: "① 阳（白底深墨）", sub: "yang.svg" },
        { mode: "yin", cls: "ed-yin", label: "② 阴（黑底纯白）", sub: "yin.svg" },
        { mode: "rain-yang", cls: "ed-rain-yang", label: "③ 彩虹阳（白底极光）", sub: "rainbow-yang.svg" },
        { mode: "rain-yin", cls: "ed-rain-yin", label: "④ 彩虹阴（黑底极光）", sub: "rainbow-yin.svg" }
      ];

      stackEl.innerHTML = FAMILIES.map(function (fam) {
        var cardsHtml = editions.map(function (ed) {
          var svgInner = buildMark(fam.key, ed.mode, state.struct);
          return (
            '<div class="rm-edition-card ' + ed.cls + '">' +
              '<div class="rm-ed-top"><span>' + ed.label + '</span><code>' + ed.sub + '</code></div>' +
              '<svg viewBox="0 0 128 128" class="rm-ed-svg" role="img" aria-label="' + fam.code + ' ' + ed.label + '">' + svgInner + '</svg>' +
              '<div class="rm-ed-foot">' +
                '<div class="rm-ed-lockup">' +
                  '<svg viewBox="0 0 128 128" aria-hidden="true">' + svgInner + '</svg>' +
                  '<span class="rm-ed-word" style="font-family:' + fam.font + '">Rolling-<em>Memory</em></span>' +
                '</div>' +
                '<div class="rm-ed-scales" aria-label="24px / 16px 实测">' +
                  '<svg viewBox="0 0 128 128" class="s24" aria-hidden="true">' + svgInner + '</svg>' +
                  '<svg viewBox="0 0 128 128" class="s16" aria-hidden="true">' + svgInner + '</svg>' +
                '</div>' +
              '</div>' +
            '</div>'
          );
        }).join("");

        return (
          '<section class="rm-family-panel" aria-label="' + fam.code + '">' +
            '<div class="rm-family-head">' +
              '<h3>' + fam.code + '</h3>' +
              '<span class="text-small text-muted">' + fam.spec + '</span>' +
            '</div>' +
            '<div class="rm-quad-grid">' + cardsHtml + '</div>' +
          '</section>'
        );
      }).join("");
    }

    function save() {
      if (window.zcode && window.zcode.setWidgetState) {
        window.zcode.setWidgetState({ modelContent: state, privateContent: state }).catch(function () {});
      }
    }

    var saved = window.zcode && window.zcode.widgetState;
    if (saved && typeof saved === "object") {
      if (typeof saved.struct === "string" && ["sl", "s", "solid"].indexOf(saved.struct) >= 0) {
        state.struct = saved.struct;
      }
      if (typeof saved.guides === "boolean") state.guides = saved.guides;
    }
    renderAll();

    structTabs.forEach(function (tab) {
      tab.addEventListener("click", function () {
        state.struct = tab.getAttribute("data-struct") || "sl";
        renderAll();
        save();
      });
    });

    if (gridBox) {
      gridBox.addEventListener("change", function () {
        state.guides = gridBox.checked;
        renderAll();
        save();
      });
    }

    window.addEventListener("zcode:set_globals", function (e) {
      var g = e.detail && e.detail.globals && e.detail.globals.widgetState;
      if (g && typeof g === "object") {
        if (typeof g.struct === "string" && ["sl", "s", "solid"].indexOf(g.struct) >= 0) {
          state.struct = g.struct;
        }
        if (typeof g.guides === "boolean") state.guides = g.guides;
        renderAll();
      }
    });
  })();
</script>
