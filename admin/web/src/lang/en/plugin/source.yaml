    enableConfirm: 'Enable source "{name}"? It will take part in the default sync.'
    disableConfirm: 'Disable source "{name}"? It stops taking part in the default sync and cannot be installed from; installed plugins are unaffected.'
    deleteConfirm: 'Delete source "{name}"? Its catalog snapshot is deleted too; installed plugins are unaffected.'
