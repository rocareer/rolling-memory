        reconcile: "Check the ledger and wiring on the Plugins page; the install source label is catalog:<source>:<uid>{'@'}<version>."
        goPlugins: Open plugins
errors:
    invalid_input:
        message: Invalid input
        hint: Check the name, type, catalog location and security switches, then retry.
    catalog_invalid:
        message: Invalid catalog format
        hint: Ensure the catalog uses ai-go-plugin-catalog/v1 with no unknown keys, duplicate keys or duplicate (uid, version), then test or sync again.
    network_blocked:
        message: Source unreachable (blocked by network policy)
        hint: Check the address, DNS and egress policy; private mirrors require "Allow private hosts" on the source.
    upstream_error:
        message: Source unreachable (upstream error)
        hint: Confirm the source service is available and the URL has no userinfo, query or fragment, then retry.
    repo_root_unavailable:
        message: The service is not running inside a source checkout
        hint: Point plugin.root at a source root containing go.mod, then retry. It never degrades to writing the ledger only.
    package_not_found:
        message: Package not found
        hint: Ensure the catalog package.path/url points at a real zip that is readable or downloadable.
    entry_not_found:
        message: Catalog entry not found
        hint: This (uid, version) was removed from the current source catalog; sync the catalog, refresh, then preflight/install again.
    package_size_mismatch:
        message: Package size mismatch
        hint: Re-export the package and regenerate size and sha256 with the catalog builder.
    package_sha_mismatch:
        message: sha256 mismatch
        hint: The package content changed; the author must bump the version and regenerate the catalog instead of mutating a published version.
    package_signed_mismatch:
        message: Signed flag does not match the package
        hint: Reconcile package.signed with the signature entry inside the package, then regenerate the catalog.
    unsigned_not_allowed:
        message: Unsigned or unverified package not confirmed
        hint: To accept the risk, tick "allow unsigned/unverified" in the preflight dialog; it applies to this install only.
    signature_invalid:
        message: Invalid signature
        hint: The package may have been tampered with; refuse the install and ask the author to sign it again.
    manifest_mismatch:
        message: Catalog does not match package metadata
        hint: uid/version/kind/host_api/requires must match the package metadata (ini.yaml for standard packages; plugin.yaml for the current compatible package).
    conflict:
        message: Install conflict
        hint: Resolve rule name/path, entity table or target file conflicts first, then preflight again.
    existing_targets:
        message: Target files already exist
        hint: A catalog install never overwrites existing files; confirm and remove the old files, or use an uninstalled uid and preflight again.
    rule_name_collision:
        message: Menu rule name collision
        hint: Rename the plugin rules or remove the same-named host rules, then preflight again.
    rule_path_collision:
        message: Menu path collision
        hint: Change the plugin menu path or remove the same-path host rules, then preflight again.
    entity_table_exists:
        message: Entity table already exists
        hint: Rename the entity table or remove the old table, then preflight again (plugin-managed migration tables are outside this check).
    trusted_keys_invalid:
        message: Trusted-key configuration is invalid
        hint: Fix the public keys in plugin.trusted_keys, then preflight again; this is not a "not configured" state.
    already_installed:
        message: Already installed
        hint: This version supports neither upgrade nor reinstall; check the ledger on the Plugins page. Upgrading needs a separate design.
    plugin_failed:
        message: A half-installed state exists
        hint: Clean up with aigo plugin uninstall --force <uid> first, then install again.
    downgrade_not_supported:
        message: Downgrade not supported
        hint: Install a higher version; to downgrade, confirm the uninstall and data-retention policy manually.
    upgrade_not_supported:
        message: Upgrade/reinstall not supported
        hint: Check the ledger on the Plugins page; upgrading requires uninstall-then-install or a future upgrade orchestration.
    source_not_found:
        message: Source not found
        hint: Refresh the source list and confirm the source was not deleted.
    source_disabled:
        message: Source disabled
        hint: Enable the source on the Repository sources page, sync again, then retry.
    catalog_not_synced:
        message: Catalog not synced
        hint: Press "Sync catalog" on the catalog page before preflight/install.
    catalog_stale:
        message: Catalog changed (snapshot stale)
        hint: Sync the catalog again and preflight against the new snapshot.
    lifecycle_forbidden:
        message: Installation/uninstallation is forbidden in production
        hint: 'This runtime is judged to be production (plugin.env=prod is set, or no source checkout was detected without an explicit plugin.env). Run the lifecycle command in a development environment, or set plugin.env=dev explicitly and restart the service.'
    install_failed:
        message: Install failed
        hint: Follow the message to clean up the half-installed state (aigo plugin uninstall --force <uid>), reconcile with aigo plugin list, then retry.
    unknown:
        message: Operation failed
        hint: Check the server message and logs, then retry; if the install already started, refresh the plugin list to reconcile first.
