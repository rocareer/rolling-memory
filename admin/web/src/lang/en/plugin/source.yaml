    allowPrivateHosts: Allow private hosts
    allowPrivateHostsTip: HTTP sources only; permits RFC1918/loopback mirrors but still rejects cloud metadata and link-local addresses; enabling it is audited.
    allowAbsolutePaths: Allow absolute paths
    allowAbsolutePathsTip: Local sources only; permits absolute catalog and package paths and is audited.
    weigh: Weight
    remark: Remark
    rules:
        nameRequired: Enter the source key
        namePattern: 'The source key must start with a lowercase letter, contain only lowercase letters, digits and hyphens, and be 2-32 characters long'
        titleRequired: Enter the title
        typeRequired: Select the source type
        locationRequired: Enter the catalog location
        locationUrl: An HTTP source must be an absolute http(s) URL
        locationGit: A Git source must be an http(s) address shaped as <repo URL>[#<ref>][!<in-repo catalog path>]
