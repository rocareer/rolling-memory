# 4. Get started
startQ: How do I get started?
startLead: Install it, connect your agents, and get back to work.
stepInstallTitle: Install
stepInstallText: Needs Go 1.26 or later. On macOS or Linux, this builds the program and connects the agents it finds. On Windows, run install.ps1 in PowerShell instead.
stepCheckTitle: Check the connection
stepCheckText: Confirms each agent can see the memory tool.
stepAdjustTitle: Turn things off if you prefer
stepAdjustText: In ZCode and Claude Code, the installer also adds a short reminder to each prompt that can bring in relevant past memory, and it keeps a small local record of whether recall helped, which feeds the console's stats. You can keep just the recall tool, switch the record off, or remove everything.
adjustMcpOnly: Keep only the recall tool — remove the reminders and skill files, then reconnect
adjustHooksOff: Turn off the local record of whether recall helped (this also turns off repeat filtering)
adjustUninstall: Remove everything the installer added
agentsTitle: Works with
agentsAutoText: Running install with no names connects whichever of these it finds on your machine.
agentsNamedText: These three are connected when you name them.
agentsOther: Any other tool that supports MCP can run rolling-memory mcp.
consoleText: The local console lets you browse what's been saved and see how often recall helps.

# 5. Preview
previewQ: What's next?
previewTag: Preview
previewLead: Pulse mode, a cloud engine that never sees your text.
previewBody: Still no language model and no vector database. Your computer sends only scrambled, one-way codes; the engine finds matches without ever seeing the words, and the original text is filled back in from your own copy. It's an early exploration of how agent memory could work, and isn't part of this release.
previewApply: To apply
previewSupport: Questions and support

# 6. About
aboutQ: Who makes it?
aboutLead: A small interdisciplinary team.
aboutBody: We came out of the Psychology Lake community, where we study how minds and memory work. We wanted long-term memory for coding agents to be something anyone can run, without a subscription or a hidden token bill.
aboutLicense: The source is published under PolyForm Noncommercial 1.0.0 — free to use, modify, and share for any noncommercial purpose; commercial use is licensed separately. It's provided as is, without warranty.
