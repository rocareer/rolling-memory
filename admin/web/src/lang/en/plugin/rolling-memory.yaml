    intro1Body: "Evaluation uses Maharana et al.'s 10 multi-session dialogues (5,882 turns) and the upstream-official Cat 1–4 question set (1,540 Qs: Cat 4 Single-hop 841 · Cat 2 Temporal 321 · Cat 1 Multi-hop 282 · Cat 3 Open-domain 96, with official evidence). The benchmark corpus is released upstream under CC BY-NC 4.0 and is not bundled: run rmem eval --fetch locomo --accept-upstream-license to fetch and rebuild the official set locally, or import your own locomo10.json; every run verifies the SHA-256 digests. ATM-Bench data is likewise one command away: rmem eval --fetch atm --accept-upstream-license."
