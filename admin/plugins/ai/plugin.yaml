# 表结构由迁移自管（kind: mixed 允许 entities 为空；L2 引擎不介入本插件的表）。
entities: []
web:
  # 源（本目录）是唯一事实源，落位副本是产物：
  #   web/views/** → web/src/views/admin/plugin/ai/**
  #   web/lang/<语言>.yaml → web/src/lang/<语言>/plugin/ai.yaml
  views: [web/views]
  lang: [web/lang/zh-cn.yaml, web/lang/en.yaml]
configs:
  # 安装器落库名 = plugin_ai_<name>，分组 = plugin.ai（allow_del=0）。
  # 宿主配置页不会为 plugin.<名> 分组生成 tab ⇒ 读写走插件自管 POST /admin/plugin/ai/settings/save。
  - name: api_key
    title: 网关 API Key
    type: password
    tip: 公开面 /ai/v1/* 的 Bearer 凭证；留空 = 未配置（公开面 503 fail-closed）
    value: ""
    weigh: 99
  - name: breaker_fail_threshold
    title: 熔断失败阈值
    type: number
    tip: 渠道 fail_threshold=0 时使用（默认 5）
    value: "5"
    weigh: 98
  - name: breaker_cooldown_seconds
    title: 熔断冷却秒数
    type: number
    tip: 渠道 cooldown_seconds=0 时使用（默认 60）
    value: "60"
    weigh: 97
  - name: request_timeout
    title: 请求超时（秒）
    type: number
    tip: 渠道 timeout=0 时使用（默认 60）
    value: "60"
    weigh: 96
  - name: stream_timeout
    title: 流式总超时（秒）
    type: number
    tip: 流式请求的总时长上限（默认 300；不受渠道 timeout 覆盖）
    value: "300"
    weigh: 95
  - name: currency
    title: 计费币种
    type: string
    tip: 金额出口的币种标签（默认 USD）
    value: "USD"
    weigh: 94
  - name: allow_private_hosts
    title: 允许私网上游
    type: switch
    tip: 1=放行 loopback/内网地址；本机 ollama 等自建上游需开启，否则出站护栏会拦下
    value: "0"
    weigh: 93
  # ---- 本批 10 键（0 一律表示「未配」：数值键回落到各自的代码缺省或「不限」）----
  - name: sse_max_line_bytes
    title: SSE 单行上限（字节）
    type: number
    tip: 单条 SSE 行的字节上限（含行尾换行）；0=缺省 1MiB；超限按上游协议异常终止且不可重试（不静默截断）
    value: "1048576"
    weigh: 92
  - name: sse_max_frame_bytes
    title: SSE 单帧上限（字节）
    type: number
    tip: 同帧多条 data 行拼接后的字节上限；0=缺省 8MiB；超限立即终止该帧解析（不可重试）
    value: "8388608"
    weigh: 91
  - name: sse_max_accumulated_bytes
    title: SSE 累积上限（字节）
    type: number
    tip: 流式累积内容（content+reasoning）上限；0=缺省 32MiB；触顶置截断标记并停止累积（仍逐帧转发）
    value: "33554432"
    weigh: 90
  - name: rate_limit_rpm
    title: 公开面限流（次/分/Key）
    type: number
    tip: 插件全局上限，按出示凭证分桶；0=不限；DB Key 的 rate_limit>0 时覆盖（桶容量取 Key 自身值）
    value: "0"
    weigh: 89
  - name: rate_limit_burst
    title: 公开面限流突发容量
    type: number
    tip: 全局层桶容量；0=按 max(10, ceil(rpm/60)) 自动；DB Key 覆盖层恒用该 Key 的 rate_limit
    value: "0"
    weigh: 88
  - name: rate_limit_max_inflight
    title: 公开面在飞并发上限
    type: number
    tip: 网关进程内在飞请求数上限（所有凭证共用，无 Key 级覆盖）；超限立即 429（不排队）；0=不限
    value: "0"
    weigh: 87
  - name: channel_gate_rpm_default
    title: 渠道准入 RPM 缺省
    type: number
    tip: 渠道 rpm_limit=0 时使用；0=不限（源侧缺省 1000，本插件刻意取 0）
    value: "0"
    weigh: 86
  - name: channel_gate_tpm_default
    title: 渠道准入 TPM 缺省
    type: number
    tip: 渠道 tpm_limit=0 时使用；0=不限；60s 窗口、按已成功尝试的 token 事后扣减（单实例）
    value: "0"
    weigh: 85
  - name: task_poll_seconds
    title: 任务轮询间隔（秒）
    type: number
    tip: 异步任务 worker 每轮间隔；0=缺省 5（下界 clamp ≥1，防忙等）；插件停用时 worker 空转不领活
    value: "5"
    weigh: 84
  - name: task_max_attempts
    title: 任务最大尝试次数
    type: number
    tip: 失败任务重试上限；0=缺省 3（上界 10）；每次尝试各落一行 usage（重试不覆盖上一轮计费行）
    value: "3"
    weigh: 83
