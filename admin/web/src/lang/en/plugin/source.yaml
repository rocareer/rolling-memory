subtitle: Where catalogs are hosted (local file / HTTP URL); every source uses the same catalog format
tips:
    format: Every source accepts only the ai-go-plugin-catalog/v1 format. The source type decides where the catalog is read from; it never changes fields, the parser or the install flow.
searchPlaceholder: Search source name or title
empty: No repository sources yet (create one, then sync its catalog)
